plugins { id 'com.android.application' }
def appOrigin = System.getenv('APP_URL') ?: ''
if (!(appOrigin ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) {
    throw new GradleException('Set APP_URL to your hosted HTTPS backend origin, without a trailing slash')
}
android {
    buildFeatures { buildConfig true }

    namespace 'com.brighttechsolutions.learning'
    compileSdk 35
    defaultConfig {
        applicationId 'com.brighttechsolutions.learning'
        buildConfigField 'String', 'APP_URL', '"' + appOrigin + '"'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
